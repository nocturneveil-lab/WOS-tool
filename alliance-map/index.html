<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alliance Map</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="map-controls" role="toolbar" aria-label="マップ操作">
  <div class="header-group">
    <span class="zoom-readout zoom-value" id="zoomValue" title="ズーム倍率" aria-label="ズーム倍率">100%</span>
    <div class="tool-picker" id="toolPicker" data-role-ui="edit">
      <!-- ツール一覧はこのボタンで開閉する -->
      <button id="toolPickerButton" class="map-tool tool-picker-button" type="button" data-type="select" aria-haspopup="true" aria-expanded="false" aria-controls="toolList">選択</button>
      <div class="map-tools header-popup" id="toolList" role="group" aria-label="ツール">
        <button class="map-tool active" type="button" data-type="select" aria-pressed="true">選択</button>
        <button class="map-tool" type="button" data-type="headquarters" aria-pressed="false">本部</button>
        <button class="map-tool" type="button" data-type="flag" aria-pressed="false">旗</button>
        <button class="map-tool" type="button" data-type="city" aria-pressed="false">都市</button>
        <button class="map-tool" type="button" data-type="bearTrap" aria-pressed="false">熊罠</button>
        <button class="map-tool" type="button" data-type="allianceBuilding" aria-pressed="false">同盟建築物</button>
        <button class="map-tool" type="button" data-type="largeGatheringSite" aria-pressed="false">大型採集場</button>
        <button class="map-tool" type="button" data-type="unavailable" aria-pressed="false">配置不能</button>
        <button class="map-tool" type="button" data-type="erase" aria-pressed="false">消去</button>
      </div>
    </div>
    <button id="editModeToggle" class="edit-mode-toggle icon-button active" type="button" aria-pressed="true" data-role-ui="edit">
      <svg class="icon icon-edit" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
      <svg class="icon icon-view" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="label-long" id="editModeLabel">編集モード</span>
    </button>
    <button id="undoAction" class="icon-button" type="button" disabled data-role-ui="edit" title="ひとつ戻る" aria-label="ひとつ戻る">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      <span class="label-long">ひとつ戻る</span>
    </button>
    <button id="moreMenuButton" class="more-menu-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu" aria-label="その他の操作" title="その他の操作">⋯</button>
    <div class="more-menu header-popup" id="moreMenu">
      <div class="menu-row menu-zoom">ズーム <span class="zoom-value">100%</span></div>
      <label class="menu-row label-size-control" for="labelSizeInput">
        <span>文字サイズ</span>
        <input id="labelSizeInput" type="range" min="6" max="12" step="1" value="8">
        <output id="labelSizeOutput" for="labelSizeInput">8 px</output>
      </label>
      <button id="historyButton" type="button" hidden>履歴</button>
      <button id="saveLayoutButton" type="button" data-role-ui="file">ファイルに保存</button>
      <button id="loadLayoutButton" type="button" data-role-ui="file">読み込み</button>
      <button id="exportPngButton" type="button">画像出力</button>
      <button id="exportSvgButton" type="button">SVG出力</button>
      <button id="openObjectColorSettings" type="button" data-role-ui="edit">設定</button>
      <button id="resetMapAction" type="button" data-role-ui="edit">リセット</button>
    </div>
    <input id="layoutFileInput" type="file" accept=".json,application/json">
  </div>
  <div class="cloud-controls" id="cloudControls" hidden>
    <span id="cloudStatus" class="cloud-status" role="status" aria-live="polite"></span>
    <button id="accountButton" class="account-button" type="button" data-role="viewer"></button>
  </div>
</div>
<div class="cloud-banner" id="cloudBanner" role="status" aria-live="polite" hidden>
  <span id="cloudBannerText"></span>
  <span id="cloudBannerActions" class="cloud-banner-actions"></span>
</div>
<div class="cloud-toast" id="cloudToast" role="alert" hidden></div>

<div class="map-wrap">
  <svg id="mapSvg" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<div class="coord-readout" id="coordReadout" role="status" aria-live="polite"></div>
<div class="selection-bar" id="selectionBar" role="toolbar" aria-label="選択中のオブジェクト" hidden>
  <span class="selection-swatch" id="selectionSwatch"></span>
  <span class="selection-label" id="selectionLabel"></span>
  <button id="renameSelection" type="button">名前変更</button>
  <button id="deleteSelection" class="danger" type="button">削除</button>
  <button id="clearSelection" type="button" aria-label="選択を解除">×</button>
</div>

<div class="city-dialog" id="cityNameDialog" hidden>
  <form id="cityNameForm">
    <label for="cityNameInput"><span id="cityNameTitle">都市名</span>
      <input id="cityNameInput" type="text" maxlength="24" required autocomplete="off">
      <textarea id="cityNameTextarea" rows="3" maxlength="24" autocomplete="off" hidden></textarea>
    </label>
    <div class="city-dialog-actions">
      <button id="cancelCityName" type="button">キャンセル</button>
      <button id="cityNameSubmit" type="submit">配置</button>
    </div>
  </form>
</div>

<div class="city-dialog" id="imagePreviewDialog" role="dialog" aria-modal="true" aria-label="マップ画像" hidden>
  <div class="image-preview">
    <p>画像を長押しすると「写真に追加」で保存できます。</p>
    <img id="imagePreview" alt="マップ画像">
    <div class="city-dialog-actions">
      <button id="shareImage" type="button">共有</button>
      <button id="downloadImage" type="button">ダウンロード</button>
      <button id="closeImagePreview" type="button">閉じる</button>
    </div>
  </div>
</div>

<div class="city-dialog" id="objectColorDialog" role="dialog" aria-modal="true" aria-labelledby="objectColorTitle" hidden>
  <form id="objectColorForm" class="settings-form">
    <h2 id="objectColorTitle">設定</h2>
    <h3>MAPサイズ</h3>
    <div class="settings-map-size">
      <label>横<input id="mapColsInput" type="number" min="10" max="80" step="2" value="32"></label>
      <label>縦<input id="mapRowsInput" type="number" min="10" max="80" step="2" value="32"></label>
    </div>
    <h3>文字サイズ</h3>
    <div class="settings-map-size">
      <label>熊罠<input id="bearTrapLabelSizeInput" type="number" min="6" max="30" step="1" value="12"></label>
    </div>
    <h3>オブジェクトの色</h3>
    <div class="settings-color-list">
      <label class="settings-color-row"><span>本部</span><input type="color" data-object-color="headquarters" value="#ed817a"></label>
      <label class="settings-color-row"><span>旗</span><input type="color" data-object-color="flag" value="#f4d57b"></label>
      <label class="settings-color-row"><span>都市</span><input type="color" data-object-color="city" value="#82b8e8"></label>
      <label class="settings-color-row"><span>熊罠</span><input type="color" data-object-color="bearTrap" value="#8fcda0"></label>
      <label class="settings-color-row"><span>同盟建築物</span><input type="color" data-object-color="allianceBuilding" value="#7d96ff"></label>
      <label class="settings-color-row"><span>大型採集場</span><input type="color" data-object-color="largeGatheringSite" value="#d5a783"></label>
      <label class="settings-color-row"><span>配置不能</span><input type="color" data-object-color="unavailable" value="#b8b8b8"></label>
    </div>
    <div class="settings-cloud" data-role-ui="saver">
      <h3>初期表示（全員共通）</h3>
      <div class="settings-cloud-row">
        <button id="saveInitialViewButton" type="button">現在の表示を初期表示にする</button>
      </div>
      <p class="login-note">色・MAPサイズ・熊罠の文字サイズは、保存するとWebに自動保存されます。</p>
      <h3>自分の合言葉を変更</h3>
      <div class="settings-cloud-row">
        <input id="newPasswordInput" type="password" autocomplete="new-password" minlength="6" placeholder="新しい合言葉（6文字以上）">
        <input id="newPasswordConfirmInput" type="password" autocomplete="new-password" placeholder="確認のためもう一度">
        <button id="changePasswordButton" type="button">合言葉を変更</button>
      </div>
      <p id="settingsCloudMessage" class="cloud-message" role="status" aria-live="polite"></p>
    </div>
    <div class="settings-color-actions">
      <button id="resetObjectColors" type="button">初期色</button>
      <span></span>
      <button id="cancelObjectColors" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</div>

<div class="city-dialog" id="loginDialog" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden>
  <form id="loginForm" class="settings-form" novalidate>
    <h2 id="loginTitle">ログイン</h2>
    <div class="login-tabs" role="tablist" aria-label="ログインの種類">
      <button type="button" role="tab" data-login-mode="editor" aria-selected="true">編集（合言葉）</button>
      <button type="button" role="tab" data-login-mode="saver" aria-selected="false">編集・保存（アカウント名＋合言葉）</button>
    </div>
    <p id="loginModeNote" class="login-note">編集はできますが、変更はこのブラウザ内だけで、Webには保存されません。</p>
    <label class="login-field" id="loginAccountField" hidden>アカウント名
      <input id="loginAccountInput" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20">
      <small>半角英小文字・数字・_・- の1〜20文字</small>
    </label>
    <label class="login-field">合言葉
      <input id="loginPasswordInput" type="password" autocomplete="current-password">
      <small>6文字以上</small>
    </label>
    <p id="loginError" class="cloud-message error" role="alert"></p>
    <div class="city-dialog-actions">
      <button id="cancelLogin" type="button">キャンセル</button>
      <button id="loginSubmit" type="submit">ログイン</button>
    </div>
  </form>
</div>

<div class="city-dialog" id="historyDialog" role="dialog" aria-modal="true" aria-labelledby="historyTitle" hidden>
  <div class="settings-form history-panel">
    <h2 id="historyTitle">履歴</h2>
    <div class="history-named" data-role-ui="saver">
      <input id="historyNameInput" type="text" maxlength="30" autocomplete="off" placeholder="名前（30文字まで）">
      <button id="saveNamedButton" type="button">現在の状態に名前を付けて保存</button>
    </div>
    <p id="historyMessage" class="cloud-message" role="status" aria-live="polite"></p>
    <ul id="historyList" class="history-list"></ul>
    <div class="city-dialog-actions">
      <button id="closeHistory" type="button">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  function formatFileTimestamp(date){
    function pad(value){ return String(value).padStart(2, "0"); }
    return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) +
      "_" + pad(date.getHours()) + "-" + pad(date.getMinutes());
  }

  // ---- グリッド設定 ----
  // 全体範囲は中心を基準に左右・上下に広がるように設定する。
  var GRID_N;
  var LABEL_SIZE_KEY = "alliance_map_label_size_v1";
  var MAP_COLS_KEY = "alliance_map_cols_v1";
  var MAP_ROWS_KEY = "alliance_map_rows_v1";
  var mapCols = 32;
  var mapRows = 32;
  var labelScale = 8;
  function loadIntegerSetting(key, fallback, minValue, maxValue){
    try{
      var saved = parseInt(localStorage.getItem(key), 10);
      if (!isNaN(saved) && saved >= minValue && saved <= maxValue) return saved;
    }catch(e){ console.error("setting load failed", e); }
    return fallback;
  }
  function clampMapSize(value, fallback, minValue, maxValue){
    var numeric = parseInt(value, 10);
    if (isNaN(numeric)) return fallback;
    return Math.max(minValue, Math.min(maxValue, numeric));
  }
  function saveMapRange(){
    try{
      localStorage.setItem(MAP_COLS_KEY, String(mapCols));
      localStorage.setItem(MAP_ROWS_KEY, String(mapRows));
    }catch(e){ console.error("map range save failed", e); }
  }
  function loadLabelScale(){
    try{
      var saved = parseFloat(localStorage.getItem(LABEL_SIZE_KEY));
      if (!isNaN(saved) && saved >= 6 && saved <= 12) return saved;
    }catch(e){ console.error("label scale load failed", e); }
    return 8;
  }
  mapCols = loadIntegerSetting(MAP_COLS_KEY, 32, 10, 80);
  mapRows = loadIntegerSetting(MAP_ROWS_KEY, 32, 10, 80);
  labelScale = loadLabelScale();
  // 熊罠の文字サイズは「文字サイズ」スライダーとは独立した固定値。
  var BEAR_TRAP_LABEL_SIZE_KEY = "alliance_map_bear_trap_label_size_v1";
  var DEFAULT_BEAR_TRAP_LABEL_SIZE = 12;
  var bearTrapLabelSize = loadIntegerSetting(BEAR_TRAP_LABEL_SIZE_KEY, DEFAULT_BEAR_TRAP_LABEL_SIZE, 6, 30);
  function saveBearTrapLabelSize(){
    try{ localStorage.setItem(BEAR_TRAP_LABEL_SIZE_KEY, String(bearTrapLabelSize)); }
    catch(e){ console.error("bear trap label size save failed", e); }
  }
  var panX = 0, panY = 0;
  var zoom = 2.5;
  // 表示上の100%にあたる実ズーム。公開用の初期配置を読み込んだときのズームを基準にする。
  var zoomBase = 2.5;
  var mapHeight;
  var VIEW_W, VIEW_H, HW, HH, CX, CY;
  var COORD_ORIGIN_CELL = { col: 10, row: -13 };
  var COORD_ORIGIN_POINT = { x: 659, y: 389 };

  function updateGridMetrics(){
    mapCols = clampMapSize(mapCols, 32, 10, 80);
    mapRows = clampMapSize(mapRows, 32, 10, 80);
    mapHeight = Math.max(1, window.innerHeight - document.querySelector(".map-controls").offsetHeight);
    var minDimension = Math.min(window.innerWidth, mapHeight);
    GRID_N = Math.max(1, Math.max(mapCols, mapRows));
    VIEW_W = 900 * window.innerWidth / minDimension;
    VIEW_H = 900 * mapHeight / minDimension;
    HW = HH = 900 / (2 * GRID_N);
    CX = VIEW_W / 2;
    CY = VIEW_H / 2;
  }
  // 表示位置は「画面中央に映っている点がマップ中心から何マス分ずれているか」で扱う。
  // panX/panY は画面サイズに依存するため、保存や画面サイズ変更ではこの値を使う。
  function getViewCenter(){
    return {
      x: ((VIEW_W / 2 - panX) / zoom - CX) / HW,
      y: ((VIEW_H / 2 - panY) / zoom - CY) / HH
    };
  }
  function setViewCenter(center){
    panX = VIEW_W / 2 - (CX + center.x * HW) * zoom;
    panY = VIEW_H / 2 - (CY + center.y * HH) * zoom;
  }
  function centerMapView(){
    setViewCenter({ x: 0, y: 0 });
  }
  updateGridMetrics();
  centerMapView();

  function toScreen(x, y){
    return {
      x: CX + (x - y) * HW,
      y: CY + (x + y) * HH
    };
  }

  function cellPolygon(col, row){
    var pts = [
      toScreen(col - 0.5, row - 0.5),
      toScreen(col + 0.5, row - 0.5),
      toScreen(col + 0.5, row + 0.5),
      toScreen(col - 0.5, row + 0.5)
    ];
    return pts.map(function(p){ return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
  }

  var OBJECT_COLOR_KEY = "alliance_map_object_colors_v1";
  var DEFAULT_TYPE_COLORS = { headquarters: "#ed817a", flag: "#f4d57b", city: "#82b8e8", bearTrap: "#8fcda0", allianceBuilding: "#7d96ff", largeGatheringSite: "#d5a783", unavailable: "#b8b8b8" };
  function loadTypeColors(){
    var colors = Object.assign({}, DEFAULT_TYPE_COLORS);
    try{
      var parsed = JSON.parse(localStorage.getItem(OBJECT_COLOR_KEY) || "{}");
      Object.keys(DEFAULT_TYPE_COLORS).forEach(function(type){
        if (parsed && typeof parsed[type] === "string" && /^#[0-9a-fA-F]{6}$/.test(parsed[type])) colors[type] = parsed[type].toLowerCase();
      });
    }catch(e){ console.error("object color load failed", e); }
    return colors;
  }
  function saveTypeColors(){
    try{ localStorage.setItem(OBJECT_COLOR_KEY, JSON.stringify(TYPE_COLORS)); }
    catch(e){ console.error("object color save failed", e); }
  }
  var TYPE_COLORS = loadTypeColors();
  var TYPE_LABELS = { headquarters: "本部", flag: "旗", city: "都市", bearTrap: "熊罠", allianceBuilding: "同盟建築物", largeGatheringSite: "大型採集場", unavailable: "配置不能" };
  var PLACEMENT_SIZES = { headquarters: 3, bearTrap: 3, city: 2, flag: 1, allianceBuilding: 2, largeGatheringSite: 3, unavailable: 1 };
  // 配置はWeb（cloud.js）から読み込み、ブラウザには保存しない。
  // Webに接続できないときは default-layout.json を読み込む。
  var classifications = {};
  var placements = [];
  var activeTool = "select";
  var editMode = false;
  // 選択中のオブジェクト。配列の入れ替え（ひとつ戻る・Webの更新）をまたいで追えるよう「種類|アンカー」で持つ。
  var selectedKey = null;
  function placementKey(placement){ return placement.type + "|" + placement.anchor; }
  function findTopPlacementAt(cellKey){
    for (var layerIndex = placements.length - 1; layerIndex >= 0; layerIndex--){
      if (placements[layerIndex].cells.indexOf(cellKey) !== -1) return placements[layerIndex];
    }
    return null;
  }
  function getSelectedPlacement(){
    if (!selectedKey || !editMode) return null;
    for (var layerIndex = placements.length - 1; layerIndex >= 0; layerIndex--){
      if (placementKey(placements[layerIndex]) === selectedKey) return placements[layerIndex];
    }
    return null;
  }
  function setSelection(placement){
    selectedKey = placement ? placementKey(placement) : null;
    render();
  }
  // 重ね置き禁止：type を anchor に置いたとき、ignore 以外のオブジェクトと重ならないか。
  function canOccupy(type, anchor, ignore){
    var cells = getPlacementCells(type, anchor);
    return !placements.some(function(placement){
      return placement !== ignore && placement.cells.some(function(key){ return cells.indexOf(key) !== -1; });
    });
  }
  var toastTimer = 0;
  function showMessage(text){
    var toast = document.getElementById("cloudToast");
    toast.textContent = text;
    toast.hidden = false;
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function(){ toast.hidden = true; }, 3000);
  }
  var hasUnsavedChanges = false;
  var localChangeListeners = [];
  // kind: "edit"（配置・移動・消去・名前変更）、"undo"、"reset"、"settings"、"file"
  // previousLayout: マップを丸ごと置き換える操作（reset・file）のときだけ、変更前のレイアウトを渡す。
  function emitLocalChange(kind, previousLayout){
    localChangeListeners.forEach(function(callback){
      try{ callback(kind, previousLayout); }catch(e){ console.error("local change listener failed", e); }
    });
  }
  function markLayoutChanged(kind, previousLayout){
    hasUnsavedChanges = true;
    emitLocalChange(kind || "edit", previousLayout);
  }
  // 離脱警告の判定。cloud.js が権限に応じた判定に差し替える。
  var unloadGuard = function(){ return hasUnsavedChanges; };
  window.addEventListener("beforeunload", function(event){
    if (!unloadGuard()) return;
    event.preventDefault();
    event.returnValue = "";
  });
  function getPlacementCells(type, anchorKey){
    var parts = anchorKey.split("_");
    var col = parseInt(parts[0], 10), row = parseInt(parts[1], 10);
    var size = PLACEMENT_SIZES[type];
    var offsets = Array.from({length:size}, function(_, index){ return index - size + 1; });
    var cells = [];
    offsets.forEach(function(colOffset){
      offsets.forEach(function(rowOffset){
        cells.push((col + colOffset) + "_" + (row + rowOffset));
      });
    });
    return cells;
  }
  function removePlacementAt(index){
    var placement = placements[index];
    placements.splice(index, 1);
    placement.cells.forEach(function(key){ syncPlacementCell(key, placement.type); });
  }
  function syncPlacementCell(key, removedType){
    var underlying = null;
    for (var layerIndex = placements.length - 1; layerIndex >= 0; layerIndex--){
      if (placements[layerIndex].cells.indexOf(key) !== -1){
        underlying = placements[layerIndex];
        break;
      }
    }
    if (underlying) classifications[key] = underlying.type;
    else if (classifications[key] === removedType) delete classifications[key];
  }
  var undoStack = [];
  var undoButton = document.getElementById("undoAction");
  function updateUndoButton(){ undoButton.disabled = undoStack.length === 0; }
  function rememberMapState(){
    undoStack.push({
      classifications: JSON.parse(JSON.stringify(classifications)),
      placements: JSON.parse(JSON.stringify(placements)),
      panX: panX,
      panY: panY,
      zoom: zoom,
      selectedKey: selectedKey
    });
    if (undoStack.length > 50) undoStack.shift();
    updateUndoButton();
  }
  function shiftedAnchor(anchor, deltaCol, deltaRow){
    var parts = anchor.split("_");
    return (parseInt(parts[0], 10) + deltaCol) + "_" + (parseInt(parts[1], 10) + deltaRow);
  }
  function deleteSelectedPlacement(){
    var placement = getSelectedPlacement();
    if (!placement) return;
    rememberMapState();
    removePlacementAt(placements.indexOf(placement));
    selectedKey = null;
    markLayoutChanged();
    render();
  }
  function movePlacement(placement, deltaCol, deltaRow){
    var placementIndex = placements.indexOf(placement);
    if (placementIndex === -1 || (!deltaCol && !deltaRow)) return;
    rememberMapState();
    var wasSelected = selectedKey === placementKey(placement);
    var previousCells = placement.cells.slice();
    placement.anchor = shiftedAnchor(placement.anchor, deltaCol, deltaRow);
    placement.cells = getPlacementCells(placement.type, placement.anchor);
    if (wasSelected) selectedKey = placementKey(placement);
    placements.splice(placementIndex, 1);
    placements.push(placement);
    var changedCells = {};
    previousCells.concat(placement.cells).forEach(function(key){ changedCells[key] = true; });
    Object.keys(changedCells).forEach(function(key){ syncPlacementCell(key, placement.type); });
    markLayoutChanged();
    render();
  }
  function undoMapAction(){
    if (!undoStack.length) return;
    var previous = undoStack.pop();
    classifications = previous.classifications;
    placements = previous.placements;
    panX = previous.panX;
    panY = previous.panY;
    zoom = previous.zoom;
    selectedKey = previous.selectedKey || null;
    updateGridMetrics();
    markLayoutChanged("undo");
    updateZoomReadout();
    updateUndoButton();
    render();
  }

    var height = bottom.y - top.y + padding * 2;
    var exportSvg = el("svg", {
      xmlns: svgns,
      // width/height は指定せず、開いた画面に合わせて全体を中央に収める。
      viewBox: minX.toFixed(1) + " " + minY.toFixed(1) + " " + width.toFixed(1) + " " + height.toFixed(1),
      preserveAspectRatio: "xMidYMid meet",
      "font-family": "Hiragino Sans, Yu Gothic UI, Meiryo, sans-serif"
    });
    if (pixelSize){
      var pixelScale = pixelSize / Math.max(width, height);
      exportSvg.setAttribute("width", Math.round(width * pixelScale));
      exportSvg.setAttribute("height", Math.round(height * pixelScale));
    }
    exportSvg.appendChild(el("rect", { x: minX, y: minY, width: width, height: height, fill: "#ffffff" }));
    var content = gridLayer.cloneNode(true);
    content.removeAttribute("transform");
    Array.from(content.querySelectorAll(".map-center-point, .selection-outline")).forEach(function(node){ node.remove(); });
    exportSvg.appendChild(content);
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(exportSvg);
  }

  // ---- 権限 ----
  // "local"：Webに接続していない（cloud.js が動かない）状態。現行どおりすべての操作を使える。
  // "viewer" / "editor" / "saver"：cloud.js が設定する。表示の出し分けは CSS（body[data-role]）で行う。
  var currentRole = "local";
  var readOnly = false;
  function applyRoleUi(){
    document.body.setAttribute("data-role", currentRole);
    document.body.classList.toggle("read-only", readOnly);
    if (currentRole === "viewer" || readOnly){
      editMode = false;
      closeNameDialog();
      closeObjectColorDialog();
      closeMenus();
      cancelObjectDrag();
      if (selectedKey){
        selectedKey = null;
        render();
      }
    }
    updateEditModeButton();
    updateMapCursor();
  }
  function setRole(role){
    currentRole = role;
    applyRoleUi();
  }
  // 履歴のプレビュー中など、一時的に編集を止める。
  function setReadOnly(value){
    readOnly = !!value;
    applyRoleUi();
  }
  function isBusy(){
    return !!(objectDragState || pinchState || longPressState || (dragState && dragState.moved) ||
      !cityNameDialog.hidden || !objectColorDialog.hidden);
  }
  function loadDefaultLayout(){
    return fetch("./default-layout.json", { cache: "no-cache" })
      .then(function(response){
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function(layout){
        applyLayout(layout, { source: "default" });
        return layout;
      });
  }
  var cloudAttached = false;
  window.AllianceMapApp = {
    getLayout: getLayout,
    applyLayout: function(layout, options){ applyLayout(layout, options); },
    loadDefaultLayout: loadDefaultLayout,
    setRole: setRole,
    getRole: function(){ return currentRole; },
    setReadOnly: setReadOnly,
    onLocalChange: function(callback){ localChangeListeners.push(callback); },
    isBusy: isBusy,
    setUnloadGuard: function(guard){ unloadGuard = guard; },
    // 一時的なお知らせ（画面下のトースト）。空文字なら何もしない。
    setStatus: function(text){ if (text) showMessage(text); },
    // 現在のズームを100%表示の基準にする（「現在の表示を初期表示にする」用）。
    setZoomBase: function(value){
      zoomBase = value;
      updateZoomReadout();
    },
    attachCloud: function(){ cloudAttached = true; }
  };

  applyRoleUi();
  render();
  // cloud.js が読み込めない環境（file:// やCDNに接続できない場合）は、現行どおり default-layout.json を表示する。
  window.setTimeout(function(){
    if (cloudAttached) return;
    loadDefaultLayout().catch(function(error){
      console.error("published layout load failed", error);
      showMessage("公開用の配置を読み込めません: " + error.message);
    });
  }, 1500);
})();
</script>
<script type="module" src="./cloud.js"></script>
</body>
</html>
